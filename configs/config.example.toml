# 配置模板：复制为 configs/config.local.toml（不提交）或 configs/config.toml。
# 复制后按实际服务填写 base_url；**凭据不写在本文件**，只放项目根的 .env。
# 模型 ID 为 2026-10-06 S03-06 实测可用值（硅基流动），换服务需同步改 ID。
[models.stage1]
# 例：base_url = "https://api.siliconflow.cn/v1"
base_url = ""
model = "deepseek-ai/DeepSeek-V3"
api_key_env = "AIDHU_STAGE1_API_KEY"
timeout_seconds = 120

[models.stage2]
# 例：base_url = "https://api.siliconflow.cn/v1"
base_url = ""
model = "deepseek-ai/DeepSeek-R1"
api_key_env = "AIDHU_STAGE2_API_KEY"
timeout_seconds = 300

[credentials]
fallback_env = "AIDHU_API_KEY"

[execution]
concurrency = 1
max_attempts_per_stage_campaign = 3
retry_backoff_seconds = [2, 4]

[limits]
max_upload_bytes = 52428800
max_records = 1000

[paths]
database = "data/state.sqlite3"
uploads = "data/uploads"
runtime = "data/runtime"
outputs = "outputs"
logs = "logs"
frontend_dist = "dist/frontend"
